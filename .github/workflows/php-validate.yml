name: PHP Validation

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP
        run: composer lint:php

      - name: Validate WordPress coding standards
        run: composer lint:wpcs

      - name: Preserve committed POT file
        run: cp languages/st-wp-starter.pot /tmp/st-wp-starter.committed.pot

      - name: Generate POT file
        run: composer make-pot

      - name: Normalize volatile POT headers for comparison
        run: |
          php core/tools/normalize-pot.php /tmp/st-wp-starter.committed.pot --ci
          php core/tools/normalize-pot.php languages/st-wp-starter.pot --ci

      - name: Confirm POT strings are committed
        run: diff -u /tmp/st-wp-starter.committed.pot languages/st-wp-starter.pot
